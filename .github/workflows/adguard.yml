name: Compile Combined AdGuard List to Sing-Box SRS

on:
  schedule:
    # Runs automatically every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache sing-box binary
        id: cache-sing-box
        uses: actions/cache@v4
        with:
          path: ~/.sing-box/sing-box
          key: ${{ runner.os }}-sing-box-v2

      - name: Install sing-box (if not cached)
        if: steps.cache-sing-box.outputs.cache-hit != 'true'
        run: |
          # Создаем папку в домашней директории
          mkdir -p ~/.sing-box
          # Скачиваем и устанавливаем
          curl -fsSL https://sing-box.app/install.sh | sudo sh
          # Копируем бинарник в нашу локальную папку для сохранения в кэш
          cp /usr/bin/sing-box ~/.sing-box/sing-box

      - name: Restore sing-box from cache (if cached)
        if: steps.cache-sing-box.outputs.cache-hit == 'true'
        run: |
          # Если кэш сработал, копируем файл обратно в системную директорию с правами sudo
          sudo cp ~/.sing-box/sing-box /usr/bin/sing-box
          sudo chmod +x /usr/bin/sing-box

      - name: Fetch, Combine, and Convert AdGuard Lists
        run: |
          # 1. Download both lists and concatenate them into a single file
          curl -sSL "https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt" > combined_adguard.txt
          echo "" >> combined_adguard.txt  # Ensure newline separator
          curl -sSL "https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt" >> combined_adguard.txt

          # 2. Convert combined text file into single binary SRS format
          sing-box rule-set convert --type adguard --output adguard_combined.srs combined_adguard.txt

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add adguard_combined.srs
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto-update adguard_combined.srs" && git push)
